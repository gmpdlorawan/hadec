[Config HysteresisBest]
extends = HysteresisEq
**.ecn.hystMargin = ("${cas}" == "PA") ? 9dB : 9dB
**.ecn.hystCount = ("${cas}" == "PA") ? 3 : 2

[Config HysteresisBest_Gw4]
extends = HysteresisBest, Gw4

[Config HysteresisBest_Gw8]
extends = HysteresisBest, Gw8

# ======================================================================
# Comparaison réaliste
#  - ReactiveLC : règle réactive (inspirée de LoRaRoam [4]) avec une détection réaliste de la perte du réseau :
#    LinkCheckReq tous les 10 messages, reconnexion autonome après 2 LinkCheckReq sans réponse
#  - FallGeo : prédiction de trajectoire (inspirée de Fall et al. [8]) avec une position estimée par géolocalisation
#    réseau (écart-type de 200 m par position) au lieu de la position exacte
# ======================================================================
[Config ReactiveLC]
extends = Reactive
**.loRaNodes[*].app[0].linkCheckPeriod = 10
**.loRaNodes[*].app[0].linkCheckMissLimit = 2

[Config FallGeo]
extends = FallEq
**.ecn.sigmaPos = 200m

[Config ReactiveLC_Gw4]
extends = ReactiveLC, Gw4

[Config ReactiveLC_Gw8]
extends = ReactiveLC, Gw8

[Config FallGeo_Gw4]
extends = FallGeo, Gw4

[Config FallGeo_Gw8]
extends = FallGeo, Gw8

# balayage de l'hystérésis (reglages.sh, choisir_hysteresis.py)
[Config HystBalayage]
extends = HysteresisEq
**.ecn.hystMargin = ${hm=3,6,9,12}dB
**.ecn.hystCount = ${hc=1,2,3}
