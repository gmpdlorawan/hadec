# ======================================================================
# HADEC v2 - campagne FLoRa / OMNeT++ (deux opérateurs LoRaWAN, A = NetID 0, B = NetID 1)
# ======================================================================
[General]
network = flora.simulations.hadec.HadecNetwork
rng-class = "cMersenneTwister"
seed-set = ${repetition}
repeat = 40
sim-time-limit = 4000s
simtime-resolution = -11
**.vector-recording = false
**.statistic-recording = true
**.scalar-recording = true
output-scalar-file = results3/${configname}-${iterationvarsf}r${repetition}.sca
output-vector-file = results3/${configname}-${iterationvarsf}r${repetition}.vec
cmdenv-express-mode = true
cmdenv-status-frequency = 60s

# ---------------- canal : modèle d'Oulu (Petäjäjärvi et al., 2015) ----------------
**.radio.radioMediumModule = "LoRaMedium"
**.LoRaMedium.pathLoss.typename = "LoRaPathLossCorrelated"
**.LoRaMedium.pathLoss.sigma = 7.8
**.maxTransmissionDuration = 4s
**.energyDetection = -110dBm
**.minInterferenceTime = 0s
**.radio.separateTransmissionParts = false
**.radio.separateReceptionParts = false
**.ipv4Delayer.config = xmldoc("cloudDelays.xml")
**.displayAddresses = false

# ---------------- zone : 20 km x 10 km, frontière x = 10 km ----------------
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 20000m
**.constraintAreaMaxY = 10000m
**.constraintAreaMaxZ = 0m

# ---------------- passerelles : 2 par opérateur ----------------
**.numberOfGateways = 4
**.loRaGW[*].**.initFromDisplayString = false
**.loRaGW[0].**.initialX = 3500m
**.loRaGW[0].**.initialY = 2500m
**.loRaGW[1].**.initialX = 3500m
**.loRaGW[1].**.initialY = 7500m
**.loRaGW[2].**.initialX = 16500m
**.loRaGW[2].**.initialY = 2500m
**.loRaGW[3].**.initialX = 16500m
**.loRaGW[3].**.initialY = 7500m
**.LoRaGWNic.radio.iAmGateway = true
**.loRaGW[*].numUdpApps = 1
**.loRaGW[*].packetForwarder.localPort = 2000
**.loRaGW[*].packetForwarder.destPort = 1000
# EU868 : duty cycle par sous-bande (RX1 1 %, RX2 10 %), RX2 = SF12 / 869,525 MHz / 27 dBm
**.loRaGW[*].LoRaGWNic.mac.euDutyCycle = true
**.loRaGW[*].packetForwarder.rx2Fallback = true
**.loRaNodes[*].LoRaNic.mac.useRx2Params = true
**.networkServer[*].app[0].rx2SnrMargin = ${rx2m=3}dB
**.loRaGW[0].packetForwarder.destAddresses = "networkServer[0]"
**.loRaGW[1].packetForwarder.destAddresses = "networkServer[0]"
**.loRaGW[2].packetForwarder.destAddresses = "networkServer[1]"
**.loRaGW[3].packetForwarder.destAddresses = "networkServer[1]"

# ---------------- serveurs réseau ----------------
**.networkServer[*].numApps = 1
**.networkServer[*].app[0].typename = "RoamingNetworkServerApp"
**.networkServer[*].app[0].netId = ancestorIndex(1)
**.networkServer[*].app[0].serverPaths = "HadecNetwork.networkServer[0].app[0] HadecNetwork.networkServer[1].app[0]"
**.networkServer[*].app[0].ecnModule = "HadecNetwork.ecn"
**.networkServer[*].app[0].receiveDelay1 = 5s
# cas d'accord : PA = itinérance passive + active ; A = active seule
**.networkServer[*].app[0].passiveAgreement = ("${cas=PA,A}" == "PA")
**.networkServer[*].app[0].activeAgreement = true

# ---------------- ECN ----------------
**.ecn.serverPaths = "HadecNetwork.networkServer[0].app[0] HadecNetwork.networkServer[1].app[0]"
**.ecn.gwNets = "0 0 1 1"
**.ecn.pendingHold = 75s    # une tentative = ForceRejoinReq + Rejoin (+1 nouvel essai à 32 s) + confirmation au message suivant
**.ecn.traceFile = "traces/" + "${prefixe=v5}" + "_" + string(${repetition}) + ".movements"

# ---------------- terminaux ----------------
**.numberOfNodes = 100
**.loRaNodes[*].mobility.typename = "BonnMotionMobility"
**.loRaNodes[*].mobility.traceFile = "traces/" + "${prefixe}" + "_" + string(${repetition}) + ".movements"
**.loRaNodes[*].mobility.nodeId = parentIndex()
**.loRaNodes[*].mobility.is3D = false
**.loRaNodes[*].numApps = 1
**.loRaNodes[*].app[0].typename = "RoamingLoRaApp"
**.loRaNodes[*].app[0].homeNetId = 0
**.loRaNodes[*].app[0].timeToNextPacket = uniform(54s, 66s)
**.loRaNodes[*].app[0].confirmedProbability = 0.02   # ~1 accusé de réception par heure et par terminal (usage équitable)
**.loRaNodes[*].app[0].initialLoRaSF = 10
**.loRaNodes[*].app[0].initialLoRaTP = 14dBm
**.loRaNodes[*].app[0].receiveDelay1 = 5s
**.loRaNodes[*].LoRaNic.mac.receiveDelay1 = 5s
**.loRaNodes[*].LoRaNic.mac.receiveWindow = 1s
**.loRaNodes[*].LoRaNic.radio.energyConsumer.typename = "LoRaEnergyConsumer"
**.loRaNodes[*].**.energySourceModule = "^.IdealEpEnergyStorage"
**.loRaNodes[*].LoRaNic.radio.energyConsumer.configFile = xmldoc("energyConsumptionParameters.xml")

# ======================================================================
# Configurations comparées
# ======================================================================
[Config Passif]
**.ecn.strategy = "none"

[Config Reactive]
**.ecn.strategy = "none"
**.loRaNodes[*].app[0].autonomousRejoin = true

[Config Hysteresis]
**.ecn.strategy = "hysteresis"

[Config Hadec2]
**.ecn.strategy = "hadec2"
**.ecn.tBloc = 600s
# seuils tirés des coûts (section IV-D) : beta = C_tot / (C_tot + C_tard)
#  PA : rester en passif coûte peu (C_tot = 4 C_tard) -> beta = 0,8 ; perdre A est sans gravité -> pas de dernière chance
#  A  : manquer la fenêtre coupe le terminal (C_tot = C_tard) -> beta = 0,5 ; gamma = 0,5
**.ecn.beta = ("${cas}" == "PA") ? 0.8 : 0.5
**.ecn.gamma = ("${cas}" == "PA") ? 1.01 : 0.5

[Config Periodique]
**.ecn.strategy = "none"
**.loRaNodes[*].app[0].periodicRejoinCount = 16

[Config Fall]
**.ecn.strategy = "fall"

[Config Oracle]
**.ecn.strategy = "oracle"

# ======================================================================
# Campagne d'équité : mêmes options pour toutes les règles déclenchées par le réseau
#   - blocage de 600 s après un transfert (T_bloc)
#   - SF de la reconnexion choisi à partir du signal mesuré par B (même règle pour tous)
# ======================================================================
[Config HysteresisEq]
extends = Hysteresis
**.ecn.tBloc = 600s
**.ecn.commonRejoinSF = true

[Config FallEq]
extends = Fall
**.ecn.tBloc = 600s
**.ecn.commonRejoinSF = true

[Config OracleEq]
extends = Oracle
**.ecn.tBloc = 600s

# ablation : HADEC v2 sans blocage et sans choix du SF de reconnexion
[Config Hadec2Nu]
extends = Hadec2
**.ecn.tBloc = 0s
**.ecn.adaptRejoinSF = false

# balayage de l'hystérésis à options égales (réglage choisi : meilleur accusé de réception en PA, meilleure livraison en A)
[Config Gw4]
**.numberOfGateways = 8
**.ecn.gwNets = "0 0 0 0 1 1 1 1"
**.loRaGW[0].**.initialX = 3500m
**.loRaGW[0].**.initialY = 1250m
**.loRaGW[0].packetForwarder.destAddresses = "networkServer[0]"
**.loRaGW[1].**.initialX = 3500m
